<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 50" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="cyanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A8C8" />
      <stop offset="100%" stop-color="#1B8DAE" />
    </linearGradient>
    <linearGradient id="roofGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="100%" stop-color="#D85434" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Outer Pill Background -->
  <rect x="1" y="1" width="74" height="48" rx="24" fill="url(#cyanBg)" filter="url(#badgeShadow)" />
  
  <!-- Subtle Pill Inner Border -->
  <rect x="2" y="2" width="72" height="46" rx="23" stroke="#52C4E2" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Modern Architectural Building -->
  <g transform="translate(23, 10)">
    <!-- Building main block -->
    <rect x="3" y="6" width="24" height="26" rx="2" fill="#F8F9FA" />
    
    <!-- Left shadow/depth facade -->
    <path d="M3 6L0 9V32L3 32V6Z" fill="#D7DFE5" />
    
    <!-- Roof accents/antenna -->
    <rect x="8" y="2" width="2" height="4" rx="0.5" fill="url(#roofGlow)" />
    <rect x="14" y="1" width="2" height="5" rx="0.5" fill="url(#roofGlow)" />
    <rect x="20" y="2" width="2" height="4" rx="0.5" fill="url(#roofGlow)" />
    
    <!-- Building vertical window bands -->
    <rect x="6" y="9" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="11" y="9" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="16" y="9" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="21" y="9" width="3" height="4" rx="0.75" fill="#38546A" />
    
    <rect x="6" y="15" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="11" y="15" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="16" y="15" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="21" y="15" width="3" height="4" rx="0.75" fill="#38546A" />
    
    <rect x="6" y="21" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="11" y="21" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="16" y="21" width="3" height="4" rx="0.75" fill="#38546A" />
    <rect x="21" y="21" width="3" height="4" rx="0.75" fill="#38546A" />
    
    <!-- Entrance / Ground glass -->
    <rect x="11" y="27" width="8" height="5" rx="1" fill="#207693" />
  </g>
</svg>
