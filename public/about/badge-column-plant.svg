<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="circleBg" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#E2DFD8" />
      <stop offset="45%" stop-color="#CCC8BD" />
      <stop offset="100%" stop-color="#A8A395" />
    </linearGradient>
    
    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5D1C5" />
      <stop offset="25%" stop-color="#F2EFE8" />
      <stop offset="55%" stop-color="#EAE6DC" />
      <stop offset="85%" stop-color="#BFB9A9" />
      <stop offset="100%" stop-color="#9E9887" />
    </linearGradient>
    
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8749" />
      <stop offset="100%" stop-color="#2D4D22" />
    </linearGradient>
    
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA662" />
      <stop offset="100%" stop-color="#3A6329" />
    </linearGradient>
    
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="28" cy="28" r="26" fill="url(#circleBg)" filter="url(#softShadow)" />
  <circle cx="28" cy="28" r="25.5" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" />

  <g clip-path="url(#badgeClip)">
    <clipPath id="badgeClip">
      <circle cx="28" cy="28" r="26" />
    </clipPath>

    <!-- Fluted Architectural Marble Column -->
    <g transform="translate(19, 8)">
      <!-- Capital / Top moulding -->
      <rect x="0" y="3" width="18" height="4" rx="1.5" fill="#E8E5DC" />
      <rect x="2" y="7" width="14" height="2" fill="#D3CEBF" />
      
      <!-- Column Shaft -->
      <rect x="3" y="9" width="12" height="38" fill="url(#columnGrad)" />
      
      <!-- Flute grooves -->
      <line x1="5.5" y1="9" x2="5.5" y2="47" stroke="#968F7D" stroke-width="0.8" stroke-opacity="0.7" />
      <line x1="7.5" y1="9" x2="7.5" y2="47" stroke="#FFF" stroke-width="0.7" stroke-opacity="0.6" />
      <line x1="9.5" y1="9" x2="9.5" y2="47" stroke="#968F7D" stroke-width="0.8" stroke-opacity="0.7" />
      <line x1="11.5" y1="9" x2="11.5" y2="47" stroke="#FFF" stroke-width="0.7" stroke-opacity="0.6" />
    </g>

    <!-- Natural Botanical Plant Leaves draped around column -->
    <!-- Leaf 1 (Top Left) -->
    <path d="M14 26C15 18 22 15 28 17C26 24 19 28 14 26Z" fill="url(#leafGrad1)" />
    <path d="M16 25C20 20 25 18 28 17" stroke="#98C67E" stroke-width="0.8" stroke-linecap="round" />

    <!-- Leaf 2 (Right arched) -->
    <path d="M26 19C33 16 38 20 40 28C34 29 28 25 26 19Z" fill="url(#leafGrad2)" />
    <path d="M28 20C33 22 37 25 40 28" stroke="#BCE39F" stroke-width="0.8" stroke-linecap="round" />

    <!-- Leaf 3 (Middle overlap) -->
    <path d="M22 27C23 35 30 38 36 34C34 27 28 25 22 27Z" fill="url(#leafGrad1)" />
    
    <!-- Small accent bud/leaf (Bottom right) -->
    <path d="M34 31C39 30 43 33 44 38C40 39 36 36 34 31Z" fill="url(#leafGrad2)" />

    <!-- Delicate branch stem -->
    <path d="M16 30Q25 24 35 34" stroke="#253A1B" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
